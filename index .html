<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafos de quadrados perfeitos em ℤₙ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Inter',system-ui,sans-serif;background:#090d16;color:#f1f5f9;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
canvas{touch-action:none;display:block;width:100%;height:100%}
</style>
</head>
<body>
<header class="border-b border-slate-800 bg-slate-900 px-4 py-3">
  <h1 class="text-base sm:text-lg font-bold">Grafos de quadrados perfeitos em <span class="mono text-indigo-400">ℤₙ</span></h1>
  <p class="text-xs text-slate-400">Quadrados no resto da divisão por n e o papel do −1</p>
</header>

<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
<div class="lg:col-span-5 flex flex-col gap-4">
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
    <div class="flex items-center justify-between mb-3 text-xs text-slate-400">
      <label for="nSlider">Módulo <span class="mono text-slate-200">n</span> (só valores em que −1 é quadrado)</label>
      <input type="number" id="nNum" min="3" max="150" value="10" class="w-20 px-2 py-1 text-right mono text-sm bg-slate-800 border border-slate-700 rounded-lg text-white">
    </div>
    <input type="range" id="nSlider" min="3" max="150" value="10" class="w-full accent-indigo-500 mb-4">
    <p class="text-xs text-slate-400 mb-2">Casos das anotações:</p>
    <div id="presets" class="grid grid-cols-3 gap-2 mb-4"></div>
    <p class="text-xs text-slate-400 mb-2">Modelo de grafo:</p>
    <div class="grid grid-cols-2 gap-2">
      <button id="modeCayley" class="p-2.5 rounded-xl border text-left text-xs"><b>Mapeamento das Arestas</b><br><span class="text-slate-400">Liga dois números quando a diferença entre eles é um quadrado</span></button>
      <button id="modeFunc" class="p-2.5 rounded-xl border text-left text-xs"><b>Quadrado de cada número</b><br><span class="text-slate-400">Mostra para onde cada x vai ao elevar ao quadrado</span></button>
    </div>
  </section>

  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Análise algébrica</h2>
      <span id="caseBadge" class="px-2 py-0.5 rounded-md text-xs bg-emerald-500/10 text-emerald-300 border border-emerald-500/30"></span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5"><span class="text-[11px] text-slate-400 block">Fatoração</span><span id="factText" class="mono text-sm font-semibold"></span></div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5"><span class="text-[11px] text-slate-400 block">Cardinalidade</span><span id="formText" class="mono text-xs font-semibold text-indigo-300"></span></div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2"><span class="text-[11px] text-slate-400 block">|Qₙ|</span><span id="mTotal" class="mono text-lg font-bold"></span></div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2"><span class="text-[11px] text-slate-400 block">|Qₙ∖{0}|</span><span id="mNZ" class="mono text-lg font-bold text-amber-400"></span></div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2"><span class="text-[11px] text-slate-400 block">|Qₙ|/n</span><span id="mDen" class="mono text-lg font-bold text-emerald-400"></span></div>
    </div>
    <div id="m1Card" class="rounded-xl p-3 border">
      <div class="flex items-center justify-between gap-2"><h3 id="m1Title" class="text-xs font-bold"></h3><span id="dirBadge" class="text-[10px] mono uppercase px-2 py-0.5 rounded"></span></div>
      <p id="m1Desc" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
    </div>
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-slate-300">Elementos de <span class="mono text-indigo-400">Qₙ</span> (toque para filtrar):</span>
        <button id="clearBtn" class="text-[11px] text-indigo-400 hidden">Limpar</button>
      </div>
      <div id="sqList" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-2 bg-slate-950 rounded-xl border border-slate-800"></div>
    </div>
  </section>
</div>

<div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col">
  <div class="px-3 py-2 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
    <span id="title" class="text-xs sm:text-sm font-semibold"></span>
    <div id="cayOpts" class="flex flex-wrap items-center gap-2 text-xs">
      <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700">
        <button id="layCirc" class="px-2 py-1 rounded-md">Circular</button>
        <button id="layConc" class="px-2 py-1 rounded-md">Concêntrico</button>
      </div>
      <label class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700"><input type="checkbox" id="loops"><span>Laços</span></label>
    </div>
  </div>
  <div id="wrap" class="relative bg-slate-950 cursor-grab" style="height:62vh;min-height:420px">
    <canvas id="cv"></canvas>
    <div class="absolute top-3 right-3 flex items-center gap-1 bg-slate-900/95 border border-slate-700 rounded-xl p-1 select-none">
      <button id="zOut" class="w-8 h-8 rounded-lg hover:bg-slate-800">−</button>
      <span id="zTxt" class="px-1 min-w-[3rem] text-center mono text-xs text-indigo-300">100%</span>
      <button id="zIn" class="w-8 h-8 rounded-lg hover:bg-slate-800">+</button>
      <button id="zReset" class="px-2 h-8 rounded-lg text-xs hover:bg-slate-800">Ajustar</button>
    </div>
    <div id="insp" class="hidden absolute top-3 left-3 max-w-[12rem] bg-slate-900/95 border border-slate-700 rounded-xl p-3 pointer-events-none text-xs">
      <div id="iTitle" class="font-bold text-white"></div>
      <div id="iRole" class="mono text-[10px] mb-1"></div>
      <div id="iDet" class="mono text-slate-300 space-y-0.5"></div>
    </div>
    <div class="absolute bottom-2 left-2 right-2 bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 text-[11px] flex flex-wrap gap-x-3 gap-y-1 pointer-events-none">
      <span><i class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 align-middle"></i> em Qₙ</span>
      <span><i class="inline-block w-2.5 h-2.5 rounded-full bg-slate-700 align-middle"></i> não-quadrado</span>
      <span><i class="inline-block w-2.5 h-2.5 rounded-full bg-rose-600 align-middle"></i> −1 (n−1)</span>
      <span id="legEdge" class="text-slate-400"></span>
    </div>
  </div>
</div>
</main>

<script>
const S={n:10,mode:'cayley',layout:'circular',sq:new Set(),list:[],roots:new Map(),f:[],fac:{},m1:false,hover:null,sel:null,diff:null,loops:false,cam:{x:0,y:0,z:1},drag:false,moved:false,ds:{x:0,y:0},pd:null,pz:1,pos:[]};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sub=x=>String(x).split('').map(d=>SUB[d]).join('');
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a};
function factorize(n){const f={};let d=2;while(d*d<=n){while(n%d===0){f[d]=(f[d]||0)+1;n/=d}d++}if(n>1)f[n]=(f[n]||0)+1;return f}
const VALID=[];for(let k=3;k<=150;k++){const f=factorize(k);if(Object.keys(f).every(p=>p==2?f[p]===1:p%4===1))VALID.push(k)}
const rad=n=>n<=16?16:n<=30?13:n<=50?10.5:n<=90?8.2:6.2;

[10,25,65].forEach(n=>{const b=document.createElement('button');b.dataset.n=n;b.className='pre mono text-xs rounded-lg px-2 py-1.5 border text-left';
 const f=factorize(n);b.innerHTML=`<b>n = ${n}</b><br><span class="text-[10px] text-slate-400">${Object.keys(f).map(p=>f[p]>1?p+'^'+f[p]:p).join('·')}</span>`;
 b.onclick=()=>setN(n);$('presets').appendChild(b)});

function setN(v){
  const q=parseInt(v,10)||10;const n=VALID.reduce((a,b)=>Math.abs(b-q)<Math.abs(a-q)?b:a);
  $('nSlider').value=VALID.indexOf(n);$('nNum').value=n;
  document.querySelectorAll('.pre').forEach(b=>{b.className='pre mono text-xs rounded-lg px-2 py-1.5 border text-left '+(+b.dataset.n===n?'bg-indigo-600/30 border-indigo-500':'bg-slate-800 border-slate-700')});
  const sq=new Set(),roots=new Map(),f=new Array(n);
  for(let i=0;i<n;i++)roots.set(i,[]);
  for(let x=0;x<n;x++){const s=x*x%n;f[x]=s;sq.add(s);roots.get(s).push(x)}
  Object.assign(S,{n,sq,roots,f,list:[...sq].sort((a,b)=>a-b),fac:factorize(n),sel:null,diff:null,hover:null});
  S.m1=sq.has(n-1);
  analyze();layout();renderList();hideInsp();draw();
}

function analyze(){
  const {n,fac}=S,ps=Object.keys(fac).map(Number).sort((a,b)=>a-b),T=S.list.length;
  $('factText').textContent=`${n} = ${ps.map(p=>fac[p]>1?p+'^'+fac[p]:p).join(' × ')}`;
  let c,fm;
  if(ps.length===1){const p=ps[0],m=fac[p];
    if(p===2){c=`Potência de 2 (n = 2^${m})`;fm=`contagem direta = ${T}`}
    else if(m===1){c='Primo ímpar (n = p)';fm=`(p+1)/2 = ${(p+1)/2}`}
    else if(m===2){c='Parte III: n = p²';fm=`p(p−1)/2 + 1 = ${p*(p-1)/2+1}`}
    else{c='Parte VI: n = pᵐ';fm=`|Qₙ| = ${T}`}
  }else if(ps.length===2&&ps[0]===2&&fac[2]===1&&fac[ps[1]]===1){c='Parte I: n = 2p';fm=`p + 1 = ${ps[1]+1}`}
  else if(ps.length===2&&!ps.includes(2)&&Math.min(fac[ps[0]],fac[ps[1]])===1&&Math.max(fac[ps[0]],fac[ps[1]])===2){
    const p1=fac[ps[0]]===1?ps[0]:ps[1],p2=fac[ps[0]]===2?ps[0]:ps[1];
    c='Parte V: n = p₁·p₂²';fm=`${(p1+1)/2} × ${p2*(p2-1)/2+1} = ${T}`}
  else{c='Composto geral (Teorema Chinês dos Restos)';fm=`∏ |Q_{pᵢ^{mᵢ}}| = ${T}`}
  $('caseBadge').textContent=c;$('formText').textContent=fm;
  $('mTotal').textContent=T;$('mNZ').textContent=T-1;$('mDen').textContent=(T/n*100).toFixed(1)+'%';
  const odd=ps.filter(p=>p>2),card=$('m1Card'),b=$('dirBadge'),t=$('m1Title'),d=$('m1Desc');
  if(S.m1){
    card.className='rounded-xl p-3 border bg-emerald-950/25 border-emerald-500/40';t.className='text-xs font-bold text-emerald-300';
    t.textContent=`−1 ≡ ${n-1} ∈ Qₙ (simetria ativa)`;b.className='text-[10px] mono uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300';b.textContent='Não-direcionado';
    d.textContent=(odd.length?`Todos os primos ímpares (${odd.join(', ')}) satisfazem p ≡ 1 (mod 4). `:`n = ${n} admite −1 como quadrado. `)+'Se d ∈ Qₙ então −d ∈ Qₙ: as arestas são simétricas.';
    $('legEdge').textContent='— aresta simétrica';
  }else{
    card.className='rounded-xl p-3 border bg-rose-950/25 border-rose-500/40';t.className='text-xs font-bold text-rose-300';
    t.textContent=`−1 ≡ ${n-1} ∉ Qₙ (sem simetria)`;b.className='text-[10px] mono uppercase px-2 py-0.5 rounded bg-rose-500/20 text-rose-300';b.textContent='Dígrafo';
    const bad=odd.filter(p=>p%4===3);
    d.textContent=(bad.length?`O primo p = ${bad[0]} ≡ 3 (mod 4) impede −1 de ser quadrado. `:`A potência 2^${fac[2]||0} impede −1 de ser quadrado. `)+'Logo (v − u) ∈ Qₙ não implica (u − v) ∈ Qₙ: o grafo é orientado.';
    $('legEdge').textContent='➔ arco u → v';
  }
  if(S.mode==='func')$('legEdge').textContent='➔ x vai para x² (mod n)';
  $('title').textContent=(S.mode==='cayley'?'Mapeamento das Arestas em ℤ':'Quadrado de cada número (x ↦ x²) em ℤ')+sub(n);
}

function renderList(){
  const L=$('sqList');L.innerHTML='';
  S.list.forEach(s=>{const b=document.createElement('button');
    const m1=s===S.n-1,on=S.diff===s;
    b.className='px-2.5 py-1 rounded-lg mono text-xs font-semibold border '+(on?'bg-indigo-500 text-white border-indigo-300':m1?'bg-rose-500/20 text-rose-300 border-rose-500/40':s===0?'bg-slate-800 text-slate-300 border-slate-600':'bg-amber-500/15 text-amber-300 border-amber-500/30');
    b.textContent=m1?`${s} (−1)`:s;
    b.title=`Raízes: {${S.roots.get(s).join(', ')}}`;
    b.onclick=()=>{S.diff=on?null:s;if(S.mode==='func')S.sel=S.diff;clearVis();renderList();draw()};
    L.appendChild(b)});
}
function clearVis(){$('clearBtn').classList.toggle('hidden',S.diff===null&&S.sel===null)}

function resize(){const r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);layout();draw()}

function layout(){
  const r=wrap.getBoundingClientRect(),W=r.width,H=r.height,cx=W/2,cy=H/2-14,n=S.n,P=S.pos=new Array(n);
  const ring=(i,k,R,ox,oy)=>{const a=-Math.PI/2+2*Math.PI*i/k;return{x:ox+R*Math.cos(a),y:oy+R*Math.sin(a)}};
  if(S.mode==='cayley'||n>64){
    const R=Math.min(W,H)*(S.mode==='cayley'?0.36:0.38);
    if(S.layout==='circular'||S.mode!=='cayley'){for(let i=0;i<n;i++)P[i]=ring(i,n,R,cx,cy)}
    else{const z=[],u=[];for(let i=1;i<n;i++)(gcd(i,n)===1?u:z).push(i);
      P[0]={x:cx,y:cy};z.forEach((v,i)=>P[v]=ring(i,z.length,R*0.52,cx,cy));u.forEach((v,i)=>P[v]=ring(i,u.length,R,cx,cy))}
    return;
  }
  const seen=new Array(n).fill(false),comps=[];
  for(let i=0;i<n;i++){if(seen[i])continue;const c=[],q=[i];seen[i]=true;
    while(q.length){const x=q.shift();c.push(x);for(const y of [S.f[x],...S.roots.get(x)])if(!seen[y]){seen[y]=true;q.push(y)}}
    comps.push(c)}
  comps.sort((a,b)=>b.length-a.length);
  const cols=Math.ceil(Math.sqrt(comps.length)),rows=Math.ceil(comps.length/cols),cw=W*0.86/cols,ch=H*0.8/rows;
  comps.forEach((c,idx)=>{
    const ox=W*0.07+cw*((idx%cols)+0.5),oy=H*0.07+ch*(Math.floor(idx/cols)+0.5);
    const cyc=c.filter(x=>{let y=S.f[x];for(let k=0;k<n;k++){if(y===x)return true;y=S.f[y]}return false});
    const rest=c.filter(x=>!cyc.includes(x)),mR=Math.min(cw,ch)*0.37,iR=cyc.length>1?mR*0.38:0;
    cyc.forEach((x,k)=>P[x]=ring(k,cyc.length,iR,ox,oy));
    rest.forEach((x,k)=>{let d=1,y=S.f[x];while(!cyc.includes(y)&&d<5){y=S.f[y];d++}P[x]=ring(k,rest.length,Math.min(mR,iR+36*d),ox,oy)});
  });
}

function arrow(x1,y1,x2,y2,r,col,sz){
  const d=Math.hypot(x2-x1,y2-y1);if(d<r*2)return;const a=Math.atan2(y2-y1,x2-x1),tx=x2-Math.cos(a)*(r+2),ty=y2-Math.sin(a)*(r+2);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(tx,ty);
  ctx.lineTo(tx-sz*Math.cos(a-Math.PI/6),ty-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(tx-sz*Math.cos(a+Math.PI/6),ty-sz*Math.sin(a+Math.PI/6));ctx.fill();
}
function loop(x,y,r,col,hi){
  const lr=r*0.85,cy=y-r-lr*0.65;ctx.strokeStyle=col;ctx.lineWidth=hi?2.5:1.5;
  ctx.beginPath();ctx.arc(x,cy,lr,0,Math.PI*2);ctx.stroke();
}

function draw(){
  const r=wrap.getBoundingClientRect(),W=r.width,H=r.height,n=S.n,z=S.cam.z;
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+S.cam.x,H/2+S.cam.y);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  const act=S.hover!==null?S.hover:S.sel,R=rad(n),iz=1/Math.sqrt(z);
  if(S.mode==='cayley')edgesCay(n,act,R,iz);else edgesFunc(n,act,R);
  nodes(n,act,R);
  ctx.restore();
}

function edgesCay(n,act,R,iz){
  const nz=S.list.filter(s=>s!==0),sym=S.m1;
  if(S.loops)for(let u=0;u<n;u++)loop(S.pos[u].x,S.pos[u].y,R,act===u?'rgba(251,191,36,.95)':'rgba(251,191,36,.28)',act===u);
  const ds=S.diff!==null&&S.diff!==0?[S.diff]:nz;
  const est=n*ds.length,base=act!==null?0.06:est>1200?0.08:est>400?0.14:est>150?0.28:0.48;
  for(let u=0;u<n;u++)for(const d of ds){
    const v=(u+d)%n;if(u===v)continue;if(sym&&S.diff===null&&u>v)continue;
    const a=S.pos[u],b=S.pos[v],inc=act!==null&&(u===act||v===act);
    let col,lw=(inc?2.2:1.15)*iz;
    if(act!==null&&!inc&&S.diff===null){ctx.strokeStyle='rgba(99,102,241,.04)';ctx.lineWidth=.75*iz;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();continue}
    if(inc)col=sym?'rgba(129,140,248,.95)':u===act?'rgba(52,211,153,.95)':'rgba(251,113,133,.9)';
    else if(S.diff!==null){col='rgba(251,191,36,.65)';lw=1.6*iz}
    else col=`rgba(99,102,241,${base})`;
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
    if(!sym){
      const dx=b.x-a.x,dy=b.y-a.y,h=Math.hypot(dx,dy),cx=(a.x+b.x)/2-dy/h*10,cy=(a.y+b.y)/2+dx/h*10;
      ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cx,cy,b.x,b.y);ctx.stroke();
      if(inc||S.diff!==null||n<=20||S.cam.z>=1.6)arrow(cx,cy,b.x,b.y,R,col,(inc?8:5.5)*iz);
    }else{ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  }
}
function edgesFunc(n,act,R){
  for(let x=0;x<n;x++){
    const t=S.f[x],a=S.pos[x],b=S.pos[t];
    const hi=(act!==null&&(x===act||t===act))||(S.diff!==null&&t===S.diff);
    const col=hi?'rgba(34,211,238,.95)':act!==null?'rgba(148,163,184,.12)':'rgba(56,189,248,.45)';
    if(x===t)loop(a.x,a.y,R,hi?'#fbbf24':'rgba(251,191,36,.7)',hi);
    else{ctx.strokeStyle=col;ctx.lineWidth=hi?2.3:1.3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();arrow(a.x,a.y,b.x,b.y,R,col,hi?8:6)}
  }
}
function nodes(n,act,R){
  for(let i=0;i<n;i++){
    const p=S.pos[i],isSq=S.sq.has(i),m1=i===n-1,on=i===act;
    let nb=false;
    if(act!==null&&!on){
      if(S.mode==='cayley'){const d1=(i-act+n)%n,d2=(act-i+n)%n;nb=(d1&&S.sq.has(d1))||(d2&&S.sq.has(d2))}
      else nb=S.f[act]===i||S.f[i]===act;
    }
    if(on){ctx.beginPath();ctx.arc(p.x,p.y,R+6,0,7);ctx.fillStyle='rgba(99,102,241,.35)';ctx.fill()}
    let fill='#1e293b',st='#475569',tc='#94a3b8';
    if(m1&&isSq){fill='#be123c';st='#fda4af';tc='#fff'}
    else if(m1){fill='#4c0519';st='#fb7185';tc='#fecdd3'}
    else if(i===0){fill='#334155';st='#fbbf24';tc='#fff'}
    else if(isSq){fill='#b45309';st='#fcd34d';tc='#fff'}
    if(on){fill='#4f46e5';st='#c7d2fe';tc='#fff'}else if(nb)st='#38bdf8';
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fillStyle=fill;ctx.fill();
    ctx.lineWidth=((on||nb||isSq)?2:1.2)/Math.sqrt(S.cam.z);ctx.strokeStyle=st;ctx.stroke();
    if(R*S.cam.z>=5.2||on||isSq||m1){
      ctx.fillStyle=tc;ctx.font=`600 ${Math.max(5.5,R*.72)}px "JetBrains Mono",monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,p.x,p.y+.3)}
  }
}

function showInsp(v){
  const n=S.n,isSq=S.sq.has(v),rs=S.roots.get(v),g=gcd(v,n);
  $('iTitle').textContent=v===n-1?`Vértice ${v} (≡ −1)`:`Vértice ${v} ∈ ℤ${sub(n)}`;
  $('iRole').textContent=isSq?'Quadrado perfeito':'Não-quadrado';
  $('iRole').className='mono text-[10px] mb-1 '+(isSq?'text-amber-400':'text-slate-400');
  $('iDet').innerHTML=`<div>Tipo: ${v===0?'zero':g===1?'unidade':'divisor de zero'}</div><div>${v}² ≡ ${S.f[v]} (mod ${n})</div><div>Raízes: ${isSq?'{'+rs.join(', ')+'}':'∅'}</div>`+(S.mode==='cayley'?`<div>Grau: ${S.list.length-1}</div>`:'');
  $('insp').classList.remove('hidden');
}
function hideInsp(){$('insp').classList.add('hidden')}

function zoomAt(nz,ax,ay){
  const r=wrap.getBoundingClientRect(),W=r.width,H=r.height,z=Math.max(.25,Math.min(8,nz)),o=S.cam.z;if(z===o)return;
  const wx=(ax-W/2-S.cam.x)/o+W/2,wy=(ay-H/2-S.cam.y)/o+H/2;
  S.cam.z=z;S.cam.x=ax-W/2-(wx-W/2)*z;S.cam.y=ay-H/2-(wy-H/2)*z;
  $('zTxt').textContent=Math.round(z*100)+'%';draw();
}
function coords(cx,cy){
  const r=cv.getBoundingClientRect(),rx=cx-r.left,ry=cy-r.top;
  return{x:(rx-r.width/2-S.cam.x)/S.cam.z+r.width/2,y:(ry-r.height/2-S.cam.y)/S.cam.z+r.height/2,rx,ry};
}
function nodeAt(x,y){
  const hr=Math.max(rad(S.n)+3,14/S.cam.z);
  for(let i=S.n-1;i>=0;i--){const p=S.pos[i];if(p&&Math.hypot(x-p.x,y-p.y)<=hr)return i}
  return null;
}
function pick(i){
  if(i===null)return;
  S.sel=S.sel===i?null:i;clearVis();S.sel!==null?showInsp(S.sel):hideInsp();draw();
}

cv.addEventListener('mousedown',e=>{const c=coords(e.clientX,e.clientY);S.drag=true;S.moved=false;S.ds={x:c.rx-S.cam.x,y:c.ry-S.cam.y}});
cv.addEventListener('mousemove',e=>{
  const c=coords(e.clientX,e.clientY);
  if(S.drag){const nx=c.rx-S.ds.x,ny=c.ry-S.ds.y;if(Math.hypot(nx-S.cam.x,ny-S.cam.y)>3)S.moved=true;S.cam.x=nx;S.cam.y=ny;draw();return}
  const h=nodeAt(c.x,c.y);
  if(h!==S.hover){S.hover=h;cv.style.cursor=h!==null?'pointer':'grab';h!==null?showInsp(h):S.sel!==null?showInsp(S.sel):hideInsp();draw()}
});
addEventListener('mouseup',e=>{
  if(S.drag&&!S.moved){const c=coords(e.clientX,e.clientY);pick(nodeAt(c.x,c.y))}
  S.drag=false;
});
cv.addEventListener('wheel',e=>{e.preventDefault();const c=coords(e.clientX,e.clientY);zoomAt(S.cam.z*(e.deltaY<0?1.15:.87),c.rx,c.ry)},{passive:false});
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const t=e.touches[0],c=coords(t.clientX,t.clientY);S.drag=true;S.moved=false;S.ds={x:c.rx-S.cam.x,y:c.ry-S.cam.y}}
  else if(e.touches.length===2){S.drag=false;const a=e.touches[0],b=e.touches[1];S.pd=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);S.pz=S.cam.z}
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&S.drag){const t=e.touches[0],c=coords(t.clientX,t.clientY),nx=c.rx-S.ds.x,ny=c.ry-S.ds.y;if(Math.hypot(nx-S.cam.x,ny-S.cam.y)>4)S.moved=true;S.cam.x=nx;S.cam.y=ny;draw()}
  else if(e.touches.length===2&&S.pd){const a=e.touches[0],b=e.touches[1],d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY),c=coords((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);zoomAt(S.pz*d/S.pd,c.rx,c.ry)}
},{passive:false});
cv.addEventListener('touchend',e=>{
  if(S.drag&&!S.moved&&e.changedTouches.length===1){const t=e.changedTouches[0],c=coords(t.clientX,t.clientY);pick(nodeAt(c.x,c.y))}
  S.drag=false;if(e.touches.length<2)S.pd=null;
});

$('nSlider').min=0;$('nSlider').max=VALID.length-1;
$('nSlider').oninput=e=>setN(VALID[e.target.value]);
$('nNum').onchange=e=>setN(e.target.value);
$('zIn').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(S.cam.z*1.3,r.width/2,r.height/2)};
$('zOut').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(S.cam.z/1.3,r.width/2,r.height/2)};
$('zReset').onclick=()=>{S.cam={x:0,y:0,z:1};$('zTxt').textContent='100%';draw()};
$('loops').onchange=e=>{S.loops=e.target.checked;draw()};
$('clearBtn').onclick=()=>{S.diff=null;S.sel=null;S.hover=null;hideInsp();clearVis();renderList();draw()};

function setLay(l){S.layout=l;
  $('layCirc').className='px-2 py-1 rounded-md '+(l==='circular'?'bg-indigo-600 text-white':'text-slate-300');
  $('layConc').className='px-2 py-1 rounded-md '+(l==='concentric'?'bg-indigo-600 text-white':'text-slate-300');
  layout();draw()}
$('layCirc').onclick=()=>setLay('circular');
$('layConc').onclick=()=>setLay('concentric');

function setMode(m){S.mode=m;
  const on='bg-indigo-600/20 border-indigo-500 text-white',off='bg-slate-800/60 border-slate-700 text-slate-300';
  $('modeCayley').className='p-2.5 rounded-xl border text-left text-xs '+(m==='cayley'?on:off);
  $('modeFunc').className='p-2.5 rounded-xl border text-left text-xs '+(m==='func'?on:off);
  $('cayOpts').classList.toggle('hidden',m!=='cayley');
  analyze();layout();draw();
}
$('modeCayley').onclick=()=>setMode('cayley');
$('modeFunc').onclick=()=>setMode('func');

addEventListener('resize',resize);
setLay('circular');setMode('cayley');resize();setN(10);
</script>
</body>
